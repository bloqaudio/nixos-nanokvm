[package]
name = "sg2002-c906l-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = ["staticlib"]
default-members = ["."]
resolver = "3"

[lib]
crate-type = ["rlib"]

[features]
default = []
timer4 = []

[dependencies]
embedded-hal = "1.0.0"

[profile.release]
codegen-units = 1
debug = 1
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = false
