name: Build and cache

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanokvm-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, ax102, nanokvm]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build main images, userspace, and checks
        run: bash scripts/ci-build.sh
      - name: Publish and verify binary cache
        run: bash scripts/ci-publish.sh
